name: Package upstream release

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: write

concurrency:
  group: package-upstream-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      upstream_version: ${{ steps.release.outputs.upstream_version }}
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api repos/openai/codex/releases/latest)
          tag=$(jq -r '.tag_name' <<<"$release")
          upstream_version=${tag#rust-v}
          if [ "$tag" = "$upstream_version" ]; then
            echo "Unexpected Codex release tag: $tag" >&2
            exit 1
          fi

          required=(
            codex-x86_64-unknown-linux-musl.tar.gz
            codex-code-mode-host-x86_64-unknown-linux-musl.tar.gz
            codex-aarch64-unknown-linux-musl.tar.gz
            codex-code-mode-host-aarch64-unknown-linux-musl.tar.gz
          )
          for asset in "${required[@]}"; do
            jq -e --arg asset "$asset" '.assets[] | select(.name == $asset and (.digest | startswith("sha256:")))' <<<"$release" >/dev/null
          done

          prefix="openai-codex-cli-${upstream_version}-"
          latest_revision=0
          latest_tag=""
          while IFS= read -r candidate; do
            revision=${candidate#"$prefix"}
            if [[ "$candidate" == "$prefix"* && "$revision" =~ ^[0-9]+$ ]] && (( revision > latest_revision )); then
              latest_revision=$revision
              latest_tag=$candidate
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')

          if (( latest_revision == 0 )); then
            revision=1
            should_build=true
          else
            git fetch --tags --force
            if git diff --quiet "$latest_tag"..HEAD -- debian/control package.sh .github/workflows/package.yml; then
              revision=$latest_revision
              should_build=false
            else
              revision=$((latest_revision + 1))
              should_build=true
            fi
          fi

          version="${upstream_version}-${revision}"
          release_tag="openai-codex-cli-${version}"

          {
            echo "tag=$tag"
            echo "upstream_version=$upstream_version"
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "should_build=$should_build"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep

      - name: Build Debian package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./package.sh \
            '${{ needs.resolve.outputs.tag }}' \
            '${{ needs.resolve.outputs.upstream_version }}' \
            '${{ needs.resolve.outputs.version }}' \
            '${{ matrix.arch }}' \
            '${{ matrix.target }}'

      - name: Validate installed package
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/*.deb

          test "$(codex --version)" = 'codex-cli ${{ needs.resolve.outputs.upstream_version }}'
          test -x /usr/lib/openai-codex-cli/bin/codex
          test -x /usr/lib/openai-codex-cli/bin/codex-code-mode-host
          test ! -e /usr/lib/openai-codex-cli/codex-resources/bwrap
          command -v bwrap >/dev/null
          bwrap --version
          codex sandbox --help >/dev/null
          test -z "$(find /usr/lib/openai-codex-cli \( -type f -o -type d \) -perm /022 -print -quit)"

          set +e
          update_output=$(codex update 2>&1)
          update_rc=$?
          set -e
          test "$update_rc" -eq 2
          grep -q 'managed by APT' <<<"$update_output"

          # Verify that global options before the subcommand cannot bypass the wrapper.
          set +e
          update_output=$(codex -c model='"gpt-5"' update 2>&1)
          update_rc=$?
          set -e
          test "$update_rc" -eq 2
          grep -q 'managed by APT' <<<"$update_output"

          # The package must never take ownership of per-user or system Codex config.
          ! dpkg -L openai-codex-cli | grep -Eq '(^/etc/codex|/\.codex/)'

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create '${{ needs.resolve.outputs.release_tag }}' \
            --repo "$GITHUB_REPOSITORY" \
            --title 'OpenAI Codex CLI ${{ needs.resolve.outputs.version }}' \
            --notes 'Debian packages built from the official OpenAI Codex standalone Linux release. Software updates are managed by APT.' \
            dist/*.deb
